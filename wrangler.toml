name = "suprime-st-ecc-api"
main = "apps/api/src/index.ts"
compatibility_date = "2025-07-18"

[dev]
port = 8789

[triggers]
crons = ["0 4 * * *"]

# Cloudflare Email Service (requiere dominio onboarded en Email Sending).
# Si no está disponible, el código usa Resend como fallback.
[[send_email]]
name = "EMAIL"

[vars]
APP_ENV = "production"
IMAGEKIT_PUBLIC_KEY = "public_sGkaXnIgxG51APMqROLbG/uqEak="
IMAGEKIT_URL_ENDPOINT = "https://ik.imagekit.io/suprime"

[[d1_databases]]
binding = "DB"
database_name = "suprime-st-ecc-db"
database_id = "ec91ad62-2ee4-4a94-a7c8-9ec7ed9052dc"
migrations_dir = "db/migrations"

# Rate-limit distribuido. Namespace creado el 2026-09-30 (antes el código usaba
# el fallback en memoria: en Workers cada isolate tiene la suya, así que un
# atacante podía repartir intentos entre isolates).
# Sin este binding el código sigue funcionando con el Map en memoria
# (ver apps/api/src/lib/rate-limit.ts), pero el límite no es global.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "c695ababca41469a97d90502eebf1620"