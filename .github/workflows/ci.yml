name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

      # Smoke contra producción (solo lecturas + rechazos esperados;
      # crea una imagen de 1px en ImageKit y sesiones efímeras de owner).
      - run: npm run smoke
