name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

      # Cierra el bypass de rate limit del owner ANTES de las pruebas.
      #
      # El sentido del automatismo va en un solo lado, y es el seguro: si un push
      # lo activara, un push por descuido dejaria la web sin proteccion de fuerza
      # bruta. Al reves, un push siempre deja la web protegida.
      #
      # Y no se apaga DESPUES de las pruebas, sino antes: asi el smoke y el E2E
      # miden el estado real de produccion. Con el bypass puesto, las pruebas
      # correrian sin rate limit y no detectarian un fallo del propio rate limit.
      - name: Apagar el bypass de rate limit
        # Sin estos dos secrets el paso falla: el script escribe en el KV de
        # produccion con wrangler y necesita credenciales. Se pone ANTES del smoke
        # a proposito, para que las pruebas midan el estado real.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/rl-bypass.mjs off --si

      # Smoke contra producción.
      #
      # Ya no usa la cuenta del owner: entra con smoke@suprime.xyz y calcula el
      # TOTP para pedir el step-up (spec "Smoke con TOTP"). Las credenciales
      # vienen de secrets del repo; si no están, el smoke avisa y sale con
      # código 2 en vez de dar un monte de FAIL sin explicación.
      #
      # effects: sube una imagen de 1px a ImageKit, crea/borra la sesión de
      # smoke y abre un grant de step-up de 1 h. No toca datos de la tienda.
      - name: Smoke (con TOTP)
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_TOTP_SECRET: ${{ secrets.SMOKE_TOTP_SECRET }}
        run: npm run smoke

  e2e:
    # Suite E2E contra el front y la API desplegados (tarea #24).
    # Es un smoke de navegador del camino que no cubre el smoke de API:
    # login -> panel -> catálogo, y añadir al carrito -> checkout.
    runs-on: ubuntu-latest
    needs: build-and-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Pages sirve la SPA con 200 en cualquier ruta que no exista, y la CDN
      # guarda ese index.html con TTL de un AÑO bajo una URL .js. El navegador
      # rechaza el módulo ES por MIME y el chunk no carga: panel, PDP, carrito y
      # login en blanco, y no se sana solo. Ver tools/purge-assets.mjs.
      #
      # --espera-deploy es imprescindible: Pages no despliega en el push, lanza
      # un proceso asincrono de unos 5 minutos. Antes la purga corria a los 3-4
      # minutos, o sea ANTES de que existiera el despliegue, y no purgeba nada.
      # Se comprobo en produccion: purga a las 17:32, despliegue a las 17:35, y
      # /icon.svg siguio sirviendo un fichero que ya estaba borrado del repo.
      - name: Esperar al despliegue y purgar la CDN
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/purge-assets.mjs --espera-deploy

      # Va DESPUES de la purga, que es donde ya se sabe que el despliegue existe.
      # No puede estar en el job de smoke: Pages no despliega en el push, tarda
      # unos 5 minutos, y estos checks leen el HTML servido, asi que en el mismo
      # push que cambia la CSP estarian mirando la version anterior y fallarian.
      - name: CSP del documento desplegada
        run: node tools/check-csp.mjs

      - name: E2E
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_TOTP_SECRET: ${{ secrets.SMOKE_TOTP_SECRET }}
        run: npm run e2e
