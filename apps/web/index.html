  <!-- El icono es el rayo de la marca, recortado del original con alfa real.
       Antes era un SVG con un <text>⚡</text>, que no es un icono: es un glyph

  <!--
    La CSS de Google Fonts es render-blocking: retrasa el FCP hasta que llega.
    con `media="print" onload` se descarga sin bloquear y se aplica al terminar,
    con el <noscript> como red de seguridad si el JS está desactivado.
    El rel=preload de abajo sube la prioridad de esa descarga: al estar en
    media=print el navegador la trata como recurso de baja prioridad, y cuanto
    mas tarde llegan las fuentes mas se nota el intercambio (el CLS de 3-13 px
    medido en MovilLab/cls.mjs sale de aqui).
    Alternativa mejor: activar Cloudflare Fonts (plan Free) en el panel y
    cambiar el href por /_fonts/css?family=..., que quita el third-party.
  -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" />
  </noscript>
